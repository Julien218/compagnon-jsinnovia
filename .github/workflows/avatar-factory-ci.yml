name: Avatar Factory CI

on:
  pull_request:
    paths:
      - 'config/**'
      - 'workflows/comfyui/**'
      - 'characters/**'
      - 'scripts/avatar_factory_server.py'
      - 'scripts/avatar_runtime_qa.py'
      - 'scripts/test_avatar_runtime_qa.py'
      - 'scripts/avatar_reference_upload_server.py'
      - 'scripts/test_avatar_reference_upload.py'
      - 'scripts/avatar_preview_server.py'
      - 'scripts/run_avatar_comfyui.ps1'
      - 'scripts/blender_finalize_avatar.py'
      - 'scripts/render_avatar_preview.py'
      - 'scripts/sync_finops.py'
      - 'scripts/preflight_avatar_factory.ps1'
      - 'scripts/validate_avatar_factory.py'
      - 'scripts/start_avatar_factory.ps1'
      - 'QUICKSTART_AVATAR_FACTORY.md'
      - '.github/workflows/avatar-factory-ci.yml'
  push:
    branches: ['main', 'feature/avatar-factory-finops']

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @(
            'scripts/start_avatar_factory.ps1',
            'scripts/preflight_avatar_factory.ps1',
            'scripts/run_avatar_comfyui.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$path contient des erreurs PowerShell : $($errors | Out-String)"
            }
          }
          if ($failed) { exit 1 }
      - name: Validate repository contract
        run: python scripts/validate_avatar_factory.py
      - name: Test runtime QA decisions
        run: python scripts/test_avatar_runtime_qa.py
      - name: Test generic subject manifests
        run: python scripts/test_avatar_reference_upload.py
